<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>منصة العقل الرقمي – وزارة العدل</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--soft:#FBF8F1;--gold:#B8923A;--line:#e6d5a8;--brown:#4A2F1B;--mut:#8a7a6a;--ok:#2E7D4F;--warn:#D98E04;--bad:#C0392B;--blue:#2F6DB5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--brown);font:15px/1.7 Tajawal,Tahoma,sans-serif}
.app{display:flex;min-height:100vh}
nav{width:215px;background:var(--soft);border-left:2px solid var(--gold);padding:14px 10px;display:flex;flex-direction:column;gap:3px;flex-shrink:0}
nav h1{font-size:15px;margin:0 0 10px;color:var(--gold);text-align:center;line-height:1.4}
nav a{padding:8px 12px;border-radius:8px;color:var(--brown);text-decoration:none;cursor:pointer;transition:.2s;white-space:nowrap;border:1px solid transparent}
nav a:hover{background:#fff;border-color:var(--line)}nav a.on{background:#fff;border-color:var(--gold);font-weight:700}
main{flex:1;min-width:0;padding:18px 22px}
@media(max-width:800px){.app{flex-direction:column}nav{width:auto;flex-direction:row;overflow-x:auto;border-left:0;border-bottom:2px solid var(--gold);padding:8px}nav h1{display:none}main{padding:12px}}
.top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:14px}
h2{margin:0;font-size:21px;border-bottom:2px solid var(--gold);padding-bottom:4px}h3{margin:0 0 8px;font-size:16px}
.demo{background:#fff6dc;border:1px solid var(--gold);border-radius:20px;padding:2px 12px;font-size:12px}
.g{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));margin-bottom:14px}
.g2{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));margin-bottom:14px}
.c{border:1px solid var(--line);border-top:3px solid var(--gold);border-radius:10px;padding:14px;background:#fff;min-width:0}
.k{font-size:26px;font-weight:700}.m{color:var(--mut);font-size:13px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13.5px}th,td{padding:7px 8px;border-bottom:1px solid #f0e6c8;text-align:right;white-space:nowrap}th{background:var(--soft);color:var(--brown)}tr:hover td{background:#fffdf6}
.b{display:inline-block;padding:1px 10px;border-radius:12px;font-size:12px;color:#fff}
input,select,textarea,button{font:inherit;color:var(--brown);border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:#fff}
input[type=number]{width:90px}textarea{width:100%}
button{background:var(--gold);color:#fff;border:0;cursor:pointer;transition:.2s}button:hover{opacity:.85}button.s{background:#fff;color:var(--brown);border:1px solid var(--gold)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.ex{border-right:4px solid var(--gold);background:var(--soft);padding:8px 12px;border-radius:6px;margin:6px 0;font-size:13.5px}
.tile{padding:8px;border-radius:8px;color:#fff;font-size:12.5px;cursor:pointer;text-align:center;min-height:54px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:6px}
.al{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;border-right:5px solid}
.lg span{display:inline-flex;align-items:center;gap:4px;margin-left:10px;font-size:12px}.lg i{width:12px;height:12px;border-radius:3px;display:inline-block}
#toast{position:fixed;bottom:20px;left:20px;background:var(--brown);color:#fff;padding:10px 16px;border-radius:8px;display:none;z-index:9}
main.f>*{animation:fd .35s ease both}@keyframes fd{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.c{transition:.25s}.c:hover{box-shadow:0 8px 22px rgba(184,146,58,.18)}
main.w{padding:0}.sh{display:flex;justify-content:space-between;align-items:center;padding:12px 28px;border-bottom:2px solid var(--gold);position:sticky;top:0;background:#fff;z-index:5}.sh a{margin:0 12px;color:var(--brown);cursor:pointer}
.hero{padding:70px 28px 60px;text-align:center;background:radial-gradient(circle at 50% 0,#fff1c9,#fff 70%)}.hero h1{font-size:clamp(28px,5vw,48px);margin:10px 0;line-height:1.3}.hero p{max-width:650px;margin:0 auto 22px;color:var(--mut);font-size:17px}.hero button{padding:12px 30px;font-size:16px;margin:4px}
.sec2{padding:40px 28px;max-width:1100px;margin:auto}.sec2>h2{text-align:center;border:0;margin-bottom:18px}
.st{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;padding:0 28px;max-width:1100px;margin:0 auto}.st .c{text-align:center}
.ft{background:var(--brown);color:#e9dcc0;text-align:center;padding:22px;font-size:13px;border-top:3px solid var(--gold)}
.lg2{max-width:380px;margin:60px auto;display:flex;flex-direction:column;gap:10px}.ic{font-size:30px}
</style></head><body><div class="app"><nav id="nav"></nav><main id="main"></main></div><div id="toast"></div>
<script>
const N=n=>Number(n).toLocaleString('ar-EG',{maximumFractionDigits:1}),TODAY=new Date(),addM=(d,m)=>{const x=new Date(d);x.setMonth(x.getMonth()+m);return x},iso=d=>new Date(d).toISOString().slice(0,10);
const COL=['#2F6DB5','#2E7D4F','#E8C21A','#E67E22','#C0392B'],SEV=['منخفضة','متوسطة','عالية'],SC=['#2F6DB5','#D98E04','#C0392B'];
const ROLES=['مدير النظام','الإدارة المركزية','مسؤول قطاع','مسؤول محافظة/مقر','مسؤول مشروعات','مسؤول شكاوى','مسؤول أزمات','اطلاع فقط'];
const PERM={proj:[0,1,4],cmp:[0,1,2,5],idea:[0,1,2],jud:[0,1],fire:[0,1,3,6],std:[0,1,6],gov:[0]};
const MON=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر'];
const GOV=[["القاهرة",161,50],["الإسكندرية",130,17],["الشرقية",168,34],["الدقهلية",166,22],["بورسعيد",187,15],["الإسماعيلية",187,34],["السويس",192,50],["الفيوم",151,70],["بني سويف",159,76],["المنيا",150,104],["أسيوط",161,129],["سوهاج",173,148],["قنا",197,159],["الأقصر",195,171],["أسوان",202,215],["البحر الأحمر",223,129],["مطروح",65,12],["الوادي الجديد",144,179]];
const SECN=['الشهر العقاري','المحاكم','الخبراء','الطب الشرعي','التفتيش القضائي','التدريب','التخطيط والتنمية الإدارية والمتابعة','الشؤون المالية','الشؤون الإدارية','تكنولوجيا المعلومات'];
function seed(){let z=7;const r=()=>(z=(z*9301+49297)%233280)/233280;
const W=[26,20,16,12,9,7,5,4,3,2,2,1,1,1,0,0,0,0,0,0,6,11];
const sec=W.map((w,i)=>({n:SECN[i]||('قطاع تجريبي '+(i+1)),m:Array.from({length:10},()=>Math.floor(r()*w)),p:Array.from({length:10},()=>Math.floor(r()*w*1.1))}));
const st=addM(TODAY,-36),en=addM(st,60);
const P=(id,name,g,con,act,fo)=>({id,name,gov:g,con,budget:5,ps:iso(st),pe:iso(en),as:iso(addM(st,id)),ae:'',actual:act,spent:act/100*5,lic:'صدرت',des:'تم الانتهاء',fo,co:act,ut:Math.max(0,act-30),fi:0,hand:'لم يتم التسليم'});
const ex=[];let eid=1;
const gen=(site,nP,nC)=>{for(let i=0;i<nP+nC;i++){const t=i<nP?'P':'C',pr=i%9==0?-56:-(12+i%30);ex.push({id:eid++,site,type:t,loc:'طابق '+(1+i%3)+' - ممر',prod:iso(addM(TODAY,pr)),exp:iso(addM(TODAY,pr+60)),insp:iso(addM(TODAY,-(i%14))),status:i%17==5?'غير صالحة':i%23==7?'تحتاج فحص':'صالحة'})}};
gen(1,48,7);gen(2,26,4);gen(3,14,3);
return{role:ROLES[0],sec,P:[P(1,'فرع الشهر العقاري - سوهاج','سوهاج','المقاولون العرب',20,80),P(2,'فرع الشهر العقاري - المنيا','المنيا','مجموعة طلعت مصطفى',30,90),P(3,'فرع الشهر العقاري - أسيوط','أسيوط','النصر العامة للمقاولات',40,100)],
prop:[['بني سويف','جدوى - البدء'],['الفيوم','جدوى - البدء'],['قنا','جدوى - البدء'],['مطروح','تأجيل للعام القادم'],['البحر الأحمر','غير مجدٍ']],
cmp:[{id:1,t:'تأخير شديد في إنجاز معاملة توثيق منذ شهرين',s:6,d:iso(addM(TODAY,-1)),st:'قيد المعالجة'},{id:2,t:'تجربة',s:3,d:iso(TODAY),st:'جديدة'}],
ideas:[{id:1,t:'إطلاق منصة إلكترونية لحجز مواعيد التوثيق وتتبع الطلبات',s:0},{id:2,t:'برنامج تدريب للموظفين على إدارة الدعاوى',s:5}],
jud:{growth:3,norm:{'جنائي':[2400,120,200],'مدني':[1500,25,40],'أسرة':[1000,10,7]},cur:{'جنائي':[4800,200,250],'مدني':[3000,35,50],'أسرة':[2000,15,10]}},
sites:[{id:1,name:'المقر الرئيسي - القاهرة',gov:'القاهرة',area:2000,floors:5,rooms:30,garage:true,sub:5,main:1},{id:2,name:'مجمع الإسكندرية',gov:'الإسكندرية',area:1200,floors:4,rooms:20,garage:true,sub:3,main:1},{id:3,name:'مقر أسوان',gov:'أسوان',area:800,floors:3,rooms:16,garage:false,sub:2,main:1}],
ex,fs:1,cs:0,ps:1,
std:{pm2:{n:'م² لكل طفاية بودرة',v:200,src:'قيمة تجريبية - بلا مرجع',ver:'0',ok:false},gar:{n:'طفايات إضافية للجراج',v:2,src:'قيمة تجريبية - بلا مرجع',ver:'0',ok:false},co2:{n:'CO2 لكل غرفة كهرباء',v:1,src:'قيمة تجريبية - بلا مرجع',ver:'0',ok:false}},log:[]}}
let S=seed(),TK=localStorage.getItem('tk'),T0;
const api=(p,o={})=>fetch('/api'+p,{...o,headers:{'Content-Type':'application/json',...(TK?{Authorization:'Bearer '+TK}:{})}}).then(async r=>{if(r.status==401&&TK){TK=null;localStorage.removeItem('tk');S.in=false}if(!r.ok)throw new Error((await r.json().catch(()=>({}))).detail||r.status);return r.json()});
const save=()=>{if(!TK||!S.in)return;clearTimeout(T0);T0=setTimeout(()=>api('/state',{method:'PUT',body:JSON.stringify(S)}).catch(()=>toast('تعذر الحفظ على الخادم')),600)};
const can=m=>PERM[m].includes(ROLES.indexOf(S.role));
const log=a=>{S.log.unshift({t:new Date().toLocaleString('ar-EG'),r:S.role,a});S.log=S.log.slice(0,80);save()};
const toast=m=>{const t=document.getElementById('toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2500)};
const guard=m=>can(m)||(toast('صلاحيتك الحالية لا تسمح بهذه العملية'),false);
const b=(t,c)=>`<span class="b" style="background:${c}">${t}</span>`;
function bars(a,l,p){const m=Math.max(...a,...(p||[]),1),w=300/a.length;return `<svg viewBox="0 0 300 120" style="width:100%">${a.map((v,i)=>{const h=v/m*85;let s=`<rect x="${i*w+2}" y="${100-h}" width="${p?w/2-2:w-4}" height="${h}" fill="#B8923A" rx="2"/>`;if(p){const q=p[i]/m*85;s+=`<rect x="${i*w+w/2}" y="${100-q}" width="${w/2-2}" height="${q}" fill="#dccb9c" rx="2"/>`}return s+`<text x="${i*w+w/2}" y="114" font-size="8" text-anchor="middle" fill="#8a7a6a">${l[i]}</text>`}).join('')}</svg>`}
const planned=p=>Math.max(0,Math.min(100,(Date.now()-new Date(p.ps))/(new Date(p.pe)-new Date(p.ps))*100));
const pst=p=>{const g=planned(p)-p.actual;return g>5?[4,'متأخر']:g<-5?[0,'متقدم']:[1,'وفق الجدول']};
const el=p=>(Date.now()-new Date(p.ps))/31557600000;
function forecast(p){const e=el(p),rate=p.actual/Math.max(e,.01),tot=rate>0?100/rate:99,delay=tot-5;return{tot,delay,txt:`معدل الإنجاز الحالي = ${N(p.actual)}% ÷ ${N(e)} سنة = ${N(rate)}% سنويًا ← مدة الإنجاز المتوقعة ${N(tot)} سنة مقابل 5 مخططة (تأخر متوقع ${N(delay)} سنة)`}}
function fireCalc(s){const ex=S.ex.filter(e=>e.site==s.id),st=S.std,ok=e=>e.status=='صالحة'&&new Date(e.exp)>TODAY,six=addM(TODAY,6),o={ex};
o.vp=ex.filter(e=>e.type=='P'&&ok(e)).length;o.vc=ex.filter(e=>e.type=='C'&&ok(e)).length;
o.inv=ex.filter(e=>e.status=='غير صالحة'||new Date(e.exp)<=TODAY);o.soon=ex.filter(e=>ok(e)&&new Date(e.exp)<=six);
o.soonP=o.soon.filter(e=>e.type=='P').length;o.soonC=o.soon.length-o.soonP;
o.rp=st.pm2.ok?Math.ceil(s.area/st.pm2.v)+(s.garage&&st.gar.ok?st.gar.v:0):null;o.rc=st.co2.ok?(s.sub+s.main)*st.co2.v:null;return o}
const jreq=(t)=>{const n=S.jud.norm[t],c=S.jud.cur[t];return{j:c[0]/(n[0]/n[1]),s:c[0]/(n[0]/n[2]),exp:n[0]*(10/5)}};
function alerts(){const A=[],add=a=>A.push(a);
S.P.forEach(p=>{const g=planned(p)-p.actual;if(g>5){const f=forecast(p);add({m:'المشروعات',sev:2,k:'توقع',t:`احتمال تأخر ${p.name}`,why:`الإنجاز الفعلي ${N(p.actual)}% مقابل ${N(planned(p))}% مخطط (فجوة ${N(g)} نقطة)`,basis:f.txt,act:'سيناريوهات: (1) زيادة الموارد وتعجيل الأعمال (2) مراجعة العقد وتطبيق غرامات التأخير (3) إعادة جدولة الدفعات بربطها بالإنجاز الفعلي',d:'خلال 30 يومًا',conf:'منخفضة - 3 سنوات من البيانات فقط والاتجاه خطي',link:'proj'})}});
for(const t in S.jud.cur){const q=jreq(t),h=S.jud.cur[t][1]/q.j,hs=S.jud.cur[t][2]/q.s;if(h<.9)add({m:'الإحصاءات القضائية',sev:h<.75?2:1,k:'فعلي',t:`عجز قضاة ${t} في القاهرة`,why:`الموجود ${N(S.jud.cur[t][1])} مقابل ${N(q.j)} مطلوب وفق المعدل المدخل`,basis:`المطلوب = القضايا ${N(S.jud.cur[t][0])} ÷ (${N(S.jud.norm[t][0])} ÷ ${N(S.jud.norm[t][1])} قاضٍ لكل 5 مليون)`,act:'ندب أو تعيين قضاة وإعادة توزيع الدوائر',d:'خلال 6 أشهر',conf:'محسوب مباشرة من المعدلات المدخلة',link:'jud'});if(hs<.8)add({m:'الإحصاءات القضائية',sev:1,k:'فعلي',t:`عجز موظفين إداريين ${t}`,why:`الموجود ${N(S.jud.cur[t][2])} مقابل ${N(q.s)} مطلوب`,basis:'نفس معادلة القضاة على معدل الموظفين',act:'تعزيز الكوادر الإدارية',d:'خلال 6 أشهر',conf:'محسوب مباشرة',link:'jud'})}
const top=[...S.sec].sort((a,b)=>b.m.reduce((x,y)=>x+y)-a.m.reduce((x,y)=>x+y))[0],l3=top.m.slice(-3).reduce((x,y)=>x+y)/3;
add({m:'الشكاوى',sev:1,k:'توقع',t:`ارتفاع الشكاوى في قطاع ${top.n}`,why:`الأعلى بين القطاعات بإجمالي ${N(top.m.reduce((x,y)=>x+y))} شكوى هذا العام`,basis:`التوقع للشهر القادم ≈ متوسط آخر 3 أشهر = ${N(l3)} شكوى`,act:'مراجعة الأسباب المتكررة وتعزيز فريق المعالجة',d:'خلال 60 يومًا',conf:'منخفضة - متوسط متحرك بسيط',link:'cmp'});
S.sites.forEach(s=>{const c=fireCalc(s),l={m:'الحريق',link:'fire',site:s.id};
if(c.inv.length)add({...l,sev:2,k:'فعلي',t:`${c.inv.length} طفاية غير صالحة أو منتهية - ${s.name}`,why:'حالتها غير صالحة أو تجاوزت تاريخ الصلاحية',basis:'سجل الطفايات',act:'استبدالها',d:'خلال 30 يومًا',conf:'بيانات مسجلة'});
if(c.soon.length)add({...l,sev:1,k:'توقع',t:`${c.soon.length} طفاية تنتهي صلاحيتها خلال 6 أشهر - ${s.name}`,why:'تاريخ الصلاحية خلال 6 أشهر أو أقل',basis:'تاريخ الصلاحية المسجل',act:'جدولة الاستبدال قبل الانتهاء',d:'قبل تاريخ الانتهاء',conf:'بيانات مسجلة'});
if(c.rp===null||c.rc===null)add({...l,sev:0,k:'فعلي',t:`تعذر تقييم الامتثال - ${s.name}`,why:'لا يوجد معيار معتمد لحساب العدد المطلوب',basis:'صفحة المعايير: المعيار غير معتمد',act:'إدخال المعيار المعتمد مع مصدره واعتماده',d:'عاجل',conf:'—'});
else{const dp=c.rp-c.vp,dc=c.rc-c.vc;if(dp>0||dc>0)add({...l,sev:2,k:'فعلي',t:`عجز طفايات - ${s.name}`,why:`بودرة: ${Math.max(dp,0)} - CO2: ${Math.max(dc,0)}`,basis:'العجز = المطلوب (من المعيار المعتمد) - الصالح',act:'توفير النواقص',d:'خلال 30 يومًا',conf:'محسوب'});
else if(c.vp-c.soonP<c.rp||c.vc-c.soonC<c.rc)add({...l,sev:1,k:'توقع',t:`عجز متوقع خلال 6 أشهر - ${s.name}`,why:'اقتراب انتهاء صلاحية مجموعة طفايات سيخفض الصالح دون المطلوب',basis:'الصالح - المنتهية خلال 6 أشهر < المطلوب',act:'إعداد خطة توريد استباقية',d:'قبل 6 أشهر',conf:'محسوب على تواريخ مسجلة'})}});
return A.sort((a,b)=>b.sev-a.sev)}
const alCard=a=>`<div class="al" style="border-right-color:${SC[a.sev]}"><div>${b(SEV[a.sev],SC[a.sev])} ${b(a.k,'#8a7a6a')} <b>${a.t}</b></div><div class="m">السبب: ${a.why}<br>الأساس: ${a.basis}<br>الإجراء: ${a.act} • المدة: ${a.d} • الثقة: ${a.conf}</div></div>`;
const heat=(v,t)=>t.findIndex(x=>v<=x)<0?4:t.findIndex(x=>v<=x);
const PAGES={

function tri(t){const bad=t.trim().length<15||/^(تجربة|اختبار)/.test(t.trim()),hi=/(رشوة|فساد|تأخير|تعطل|إهمال|ضياع)/.test(t);return{ok:!bad,why:bad?'نص قصير أو بلا تفاصيل':'تفاصيل كافية',sev:hi?'عالية':'عادية'}}
const CATS=[['التحول الرقمي والعدالة الذكية',/رقم|ذكاء|إلكترون|تطبيق|منصة/],['التطوير التشريعي والإجرائي',/تشريع|قانون|إجراء|لائحة/],['تأهيل وتدريب العنصر البشري',/تدريب|تأهيل|موظف|قاض/],['تطوير البنية التحتية',/مبنى|بنية|مقر|مبان/],['الشفافية والنزاهة وحوكمة الأداء',/شفاف|نزاه|حوكمة|رقابة/],['تطوير الجهات المعاونة للقضاء',/خبير|طب شرعي|معاون/]];
function cls(i,all){const m=CATS.find(c=>c[1].test(i.t)),w=x=>x.t.split(/\s+/).filter(y=>y.length>3),sim=all.find(o=>o.id!=i.id&&o.id<i.id&&w(o).filter(y=>w(i).includes(y)).length>=3);return{cat:m?m[0]:'غير مصنفة',ok:i.t.trim().length>=15,pr:(m?50:20)+Math.min(i.t.length/4,25),sim:sim&&sim.id}}
const nid=a=>Math.max(0,...a.map(x=>x.id))+1;
function Ep(id,k,v){if(!guard('proj'))return;const p=S.P.find(x=>x.id==id);p[k]=+v;log(`تعديل ${k} في ${p.name}`);render()}
function Ap(){if(!guard('proj'))return;const n=pn.value.trim();if(!n)return toast('أدخل اسم المشروع');const st=addM(TODAY,-6);S.P.push({id:nid(S.P),name:n,gov:pg.value,con:pc.value||'—',budget:5,ps:iso(st),pe:iso(addM(st,60)),as:iso(st),ae:'',actual:0,spent:0,lic:'قيد الدراسة',des:'لم تنتهِ',fo:0,co:0,ut:0,fi:0,hand:'لم يتم التسليم'});log('إضافة مشروع '+n);render()}
function Dp(id){if(!guard('proj'))return;S.P=S.P.filter(x=>x.id!=id);log('حذف مشروع '+id);render()}
function Ac(){if(!guard('cmp'))return;if(!ct.value.trim())return;S.cmp.push({id:nid(S.cmp),t:ct.value,s:+cs.value,d:iso(TODAY),st:'جديدة'});log('تسجيل شكوى');render()}
function Cs(id,v){if(!guard('cmp'))return render();S.cmp.find(c=>c.id==id).st=v;log(`حالة الشكوى ${id}: ${v}`);render()}
function Dc(id){if(!guard('cmp'))return;S.cmp=S.cmp.filter(c=>c.id!=id);log('حذف شكوى '+id);render()}
function Ai(){if(!guard('idea'))return;if(!it.value.trim())return;S.ideas.push({id:nid(S.ideas),t:it.value,s:+is.value});log('تسجيل مقترح');render()}
function Di(id){if(!guard('idea'))return;S.ideas=S.ideas.filter(c=>c.id!=id);log('حذف مقترح '+id);render()}
function Ej(k,t,i,v){if(!guard('jud'))return render();S.jud[k][t][i]=+v;log(`تعديل إحصاء ${t}`);render()}
function Es(id,k,v){if(!guard('fire'))return render();const s=S.sites.find(x=>x.id==id);s[k]=typeof v=='boolean'?v:+v;log(`تعديل بيانات ${s.name}`);render()}
function Et(k,f,v){if(!guard('std'))return render();S.std[k][f]=f=='v'?+v:v;if(f=='ok')S.std[k].date=iso(TODAY);log(`معيار ${S.std[k].n}: ${f}`);render()}
function Ae(site,t){if(!guard('fire'))return;S.ex.push({id:nid(S.ex),site,type:t,loc:'غير محدد',prod:iso(TODAY),exp:iso(addM(TODAY,60)),insp:iso(TODAY),status:'صالحة'});log('إضافة طفاية');render()}
function Eu(id){if(!guard('fire'))return;S.ex.find(e=>e.id==id).status='مستخدمة';log('استخدام طفاية '+id);render()}
function Er(id){if(!guard('fire'))return;const e=S.ex.find(x=>x.id==id);e.status='مستبدلة';S.ex.push({...e,id:nid(S.ex),prod:iso(TODAY),exp:iso(addM(TODAY,60)),insp:iso(TODAY),status:'صالحة'});log('استبدال طفاية '+id);render()}
function site(){nav.style.display='none';main.className='w';const h=location.hash.slice(1),A=alerts(),go=id=>document.getElementById(id).scrollIntoView({behavior:'smooth'});window.go=go;
const hd=`<header class="sh"><b>⚖️ وزارة العدل | العقل الرقمي</b><span><a onclick="location.hash='home'">الرئيسية</a><a onclick="location.hash='home';setTimeout(()=>go('feat'),50)">الوحدات</a><button onclick="location.hash='login'">دخول المنصة</button></span></header>`;
if(h=='login'){main.innerHTML=hd+`<div class="lg2 c"><h3>تسجيل الدخول</h3><input id="un" placeholder="اسم المستخدم"><input id="pw" type="password" placeholder="كلمة المرور"><button onclick="doLogin()">دخول</button><p class="m">الدخول بحساب يصدره مدير النظام.</p></div>`;return}
const F=[['🗺️','الخريطة الذكية','محافظات الجمهورية بألوان الإنجاز والمخاطر وبطاقات تفصيلية'],['📊','متابعة المشروعات','المخطط مقابل الفعلي والصرف والمراحل وتوقع التأخر'],['📨','الشكاوى والابتكار','خرائط حرارية وفرز آلي وترتيب أولويات'],['⚖️','الإحصاءات القضائية','فجوات القضاة والموظفين وتنبؤ بضغط العمل'],['🔥','إدارة الأزمات','نموذج الحريق: معايير معتمدة وعجز وتنبيهات استباقية'],['🧠','الذكاء الاصطناعي','تنبؤ وتوصيات بأسباب وأساس حساب ومستوى ثقة']];
main.innerHTML=hd+`<section class="hero"><div style="font-size:56px">⚖️</div><h1>العقل الرقمي لوزارة العدل<br><span style="color:var(--gold)">من البيانات إلى القرار</span></h1><p>منصة موحدة لمتابعة المشروعات والشكاوى والإحصاءات القضائية والمخاطر، بتنبيهات ذكية وسيناريوهات علاج تدعم رؤية مصر 2030.</p><button onclick="location.hash='login'">دخول المنصة</button><button class="s" onclick="go('feat')">استكشف الوحدات</button></section>
<div class="st"><div class="c"><div class="k">${S.P.length}</div><div class="m">مشروعات قائمة</div></div><div class="c"><div class="k">${S.sec.length}</div><div class="m">قطاعًا</div></div><div class="c"><div class="k">${S.ex.length}</div><div class="m">طفاية مسجلة</div></div><div class="c"><div class="k">${A.length}</div><div class="m">تنبيهًا ذكيًا</div></div></div>
<section class="sec2" id="feat"><h2>وحدات المنصة</h2><div class="g">${F.map(f=>`<div class="c"><div class="ic">${f[0]}</div><h3>${f[1]}</h3><div class="m">${f[2]}</div></div>`).join('')}</div></section>
<section class="sec2"><h2>كيف تعمل؟</h2><div class="g">${['إدخال البيانات','حساب المؤشرات','تنبيه استباقي','سيناريوهات العلاج'].map((x,i)=>`<div class="c"><div class="k" style="color:var(--gold)">${i+1}</div><b>${x}</b></div>`).join('')}</div></section><footer class="ft">وزارة العدل - جمهورية مصر العربية • البيانات المعروضة تجريبية</footer>`}
function out(){clearTimeout(T0);localStorage.removeItem('tk');TK=null;S=seed();location.hash='home';render()}
const NAV=[['dash','لوحة التحكم'],['map','الخريطة الذكية'],['proj','المشروعات'],['cmp','الشكاوى'],['idea','مركز الابتكار'],['jud','الإحصاءات القضائية'],['fire','الأزمات: الحريق'],['ai','الذكاء الاصطناعي'],['gov','الحوكمة والصلاحيات']];
let LR;function render(){if(!S.in){save();return site()}nav.style.display='';const r=PAGES[location.hash.slice(1)]?location.hash.slice(1):'dash';save();main.className=r!=LR?'f':'';LR=r;nav.innerHTML='<h1>وزارة العدل<br>العقل الرقمي</h1>'+NAV.map(n=>`<a class="${n[0]==r?'on':''}" onclick="location.hash='${n[0]}'">${n[1]}</a>`).join('');
main.innerHTML=`<div class="top"><h2>${NAV.find(n=>n[0]==r)[1]}</h2><div><span class="demo">بيانات تجريبية</span> <span class="demo">${S.user||''} - ${S.role}</span> <button class="s" onclick="out()">خروج</button></div></div>`+PAGES[r]()}
async function load(u){const d=await api('/state');if(d.state)S=d.state;S.in=true;S.role=u.role;S.user=u.username;render()}
async function doLogin(){try{const r=await api('/login',{method:'POST',body:JSON.stringify({username:un.value,password:pw.value})});TK=r.token;localStorage.setItem('tk',TK);await load(r);location.hash='dash'}catch(e){toast('بيانات الدخول غير صحيحة')}}
async function boot(){if(TK){try{await load(await api('/me'));return}catch(e){}}render()}
addEventListener('hashchange',render);boot();
</script></body></html>
